
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقرأة الشاطبية</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5f0;color:#29483e;font-family:Tahoma,Arial,sans-serif}
header{background:#29483e;color:white;text-align:center;padding:35px 15px}
header h1{font-size:29px;margin:0 0 15px}
header p{line-height:2;margin:auto;max-width:600px}
main{max-width:850px;margin:30px auto;padding:15px}
h2{text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px}
.card{background:white;border-radius:18px;padding:25px 12px;text-align:center;box-shadow:0 3px 15px #0000000d}
.card a{color:#29483e;text-decoration:none;font-weight:bold}
.card span{display:block;font-size:28px;margin-bottom:12px}
footer{text-align:center;padding:30px;color:#806c52;line-height:2}
</style>
</head>
<body>
<header>
<h1>مقرأةُ الشّــــاطِبيّـــة</h1>
<p>القرآن، رئتك الثالثة، حين تختنق من دخان الحياة فهو، ينفع، يشفع، ويرفع</p>
<p>منارة قرآنية للنساء والفتيات</p>
</header>
<main>
<h2>مرحبًا بكِ في مقرأتكِ 🌷</h2>
<div class="cards">
<div class="card"><span>📖</span><a href="#">حلقاتي</a></div>
<div class="card"><span>🌸</span><a href="#">ملفي القرآني</a></div>
<div class="card"><span>📝</span><a href="#">الحفظ والمراجعة</a></div>
<div class="card"><span>🎓</span><a href="#">المستويات والاختبارات</a></div>
<div class="card"><span>👩🏻‍🏫</span><a href="#">المعلمات والمشرفات</a></div>
<div class="card"><span>📚</span><a href="#">المكتبة التعليمية</a></div>
</div>
</main>
<footer>
مقرأة الشاطبية<br>
القرآن يجمعنا على الخير
</footer>
</body>
</html>
